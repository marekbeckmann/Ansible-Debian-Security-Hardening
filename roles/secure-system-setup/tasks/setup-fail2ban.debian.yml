---
- name: Setup Fail2ban service
  block:
    - name: Ensure Fail2ban configuration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/fail2ban
        - /etc/fail2ban/jail.d
        - /etc/fail2ban/filter.d
        - /etc/fail2ban/action.d

    - name: Pre-seed Fail2ban local configuration
      ansible.builtin.template:
        src: etc/fail2ban/fail2ban.local.j2
        dest: /etc/fail2ban/fail2ban.local
        owner: root
        group: root
        mode: "0644"

    - name: Pre-seed Fail2ban jail local configuration with whitelisted management subnets
      ansible.builtin.template:
        src: etc/fail2ban/jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"

    - name: Prevent service auto-start during Fail2ban package installation
      ansible.builtin.copy:
        content: "#!/bin/sh\nexit 101\n"
        dest: /usr/sbin/policy-rc.d
        owner: root
        group: root
        mode: "0755"

    - name: Ensure Fail2ban package is installed
      ansible.builtin.apt:
        name: fail2ban
        state: present
        update_cache: false
        install_recommends: false
        clean: true

    - name: Remove policy-rc.d restriction after Fail2ban package installation
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent

    - name: Retrieve Fail2ban version
      ansible.builtin.shell: "fail2ban-client version 2>/dev/null || fail2ban-server -V 2>/dev/null || echo '0.11.2'"
      register: _fail2ban_version_raw
      changed_when: false
      check_mode: false
      failed_when: false
      environment:
        PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:{{ ansible_facts['env']['PATH'] | default('') }}"

    - name: Register Fail2ban version fact
      ansible.builtin.set_fact:
        fail2ban_version: "{{ (_fail2ban_version_raw.stdout | default('') | regex_search('([0-9]+\\.[0-9]+\\.[0-9]+)')) | default('0.11.2', true) }}"
      changed_when: false
      check_mode: false

    - name: Remove default Debian Fail2ban configuration
      ansible.builtin.file:
        path: /etc/fail2ban/jail.d/defaults-debian.conf
        state: absent
      notify:
        - Restart Fail2ban

    - name: Deploy Fail2ban custom filters
      ansible.builtin.copy:
        src: "{{ fail2ban_filterd_path }}"
        dest: /etc/fail2ban/filter.d/
        owner: root
        group: root
        mode: "0644"
      when: fail2ban_filterd_path is defined
      notify:
        - Restart Fail2ban

    - name: Deploy Fail2ban custom actions
      ansible.builtin.copy:
        src: "{{ fail2ban_actiond_path }}"
        dest: /etc/fail2ban/action.d/
        owner: root
        group: root
        mode: "0644"
      when: fail2ban_actiond_path is defined
      notify:
        - Restart Fail2ban

    - name: Deploy Fail2ban custom jails
      ansible.builtin.copy:
        src: "{{ fail2ban_jaild_path }}"
        dest: /etc/fail2ban/jail.d/
        owner: root
        group: root
        mode: "0644"
      when: fail2ban_jaild_path is defined
      notify:
        - Restart Fail2ban

    - name: Deploy Fail2ban SSHD jail configuration
      ansible.builtin.template:
        src: ssh.local.j2
        dest: /etc/fail2ban/jail.d/ssh.local
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart Fail2ban

    - name: Deploy Fail2ban Discord notification action
      ansible.builtin.template:
        src: fail2ban_discord_template.conf.j2
        dest: /etc/fail2ban/action.d/discord_notifications.conf
        owner: root
        group: root
        # Contains the Discord webhook URL; fail2ban runs as root
        mode: "0600"
      when: 
        - vault_discord_webhook_url_f2b is defined
      notify:
        - Restart Fail2ban
      
    - name: Ensure Fail2ban service is running and enabled
      ansible.builtin.service:
        name: fail2ban
        state: "{{ service_default_state | default('started') }}"
        enabled: "{{ service_default_enabled | default(true) | bool }}"

    - name: Flush handlers to apply Fail2ban configuration updates immediately
      ansible.builtin.meta: flush_handlers

    - name: Verify SSHD jail is active in Fail2ban
      ansible.builtin.command: fail2ban-client status sshd
      register: result
      changed_when: false
      failed_when: "'sshd' not in result.stdout"
      retries: 3
      delay: 2
      until: result is succeeded
  tags:
    - secure-system-fail2ban
