fail2ban_version: "0.11.2"
fail2ban_loglevel: "{{ 'INFO' if (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] is version('16', '>=') or ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] is version('9', '>=')) else 3 }}"
lock_root_account: true
secure_proc_hidepid: false
ansible_service_user: ansible

fail2ban_logtarget: /var/log/fail2ban.log
fail2ban_syslog_target: /var/log/fail2ban.log
fail2ban_syslog_facility: 1
fail2ban_socket: /var/run/fail2ban/fail2ban.sock
fail2ban_pidfile: /var/run/fail2ban/fail2ban.pid
fail2ban_dbpurgeage: 86400

fail2ban_sendername: "Fail2ban"
fail2ban_sender: "fail2ban@{{ ansible_facts['hostname'] | default(inventory_hostname) }}"
fail2ban_ignoreips:
  - 127.0.0.1/8
  - ::1

fail2ban_bantime: 600
fail2ban_bantime_increment: true
fail2ban_bantime_factor: 1
fail2ban_bantime_formula: "ban.Time * (1<<(ban.Count if ban.Count<20 else 20)) * banFactor"
fail2ban_bantime_overalljails: false

fail2ban_maxretry: 10
fail2ban_findtime: 600
fail2ban_backend: auto
fail2ban_destemail: ""
fail2ban_banaction: iptables-multiport
fail2ban_banaction_allports: iptables-allports
fail2ban_mta: mail
fail2ban_protocol: tcp
fail2ban_chain: INPUT
fail2ban_action: "%(action_)s"
# vault_discord_webhook_url_f2b: ""

# --- Unattended Upgrades Defaults ---
origins:
  - "origin=*"
unattended_cache_valid_time: 3600
unattended_package_blacklist:
  - "linux-image"
  - "linux-headers"
  - "linux-image-extra"
  - "linux-modules"

unattended_autofix_interrupted_dpkg: true
unattended_minimal_steps: true
unattended_install_on_shutdown: false
unattended_mail: ""
unattended_mail_sender: "update-notification@{{ ansible_facts['hostname'] | default(inventory_hostname) }}"
unattended_mail_only_on_error: false
unattended_mail_report: "always"
unattended_remove_unused_dependencies: false
unattended_remove_new_unused_dependencies: true
unattended_remove_unused_kernel_packages: false
unattended_automatic_reboot: false
unattended_automatic_reboot_time: false
unattended_ignore_apps_require_restart: false
unattended_syslog_enable: true
unattended_update_package_list: 1
unattended_autoclean_interval: 7
unattended_dpkg_options: []
unattended_only_on_ac_power: false
unattended_systemd_timer_override: true
unattended_apt_daily_oncalendar: "*-*-* 6,18:00"
unattended_apt_daily_randomizeddelaysec: "12h"
unattended_apt_daily_upgrade_oncalendar: "*-*-* 6:00"
unattended_apt_daily_upgrade_randomizeddelaysec: "60m"
